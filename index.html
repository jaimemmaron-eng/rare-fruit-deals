<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rare Fruit Deals</title>
<meta name="rfd-data-base" content="data/">
<meta name="description" content="Rare named fruit plants and perennial vegetables from every seller, with the total cost delivered to your door, checked regularly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#eceff1;--card:#ffffff;--card2:#f6f8f9;--hdr:#17222c;--hdr2:#212e39;--hdr-line:#334250;--hdr-ink:#d3dce2;--hdr-dim:#8a9aa7;
  --ink:#15212b;--soft:#526272;--faint:#8593a0;--line:#dde3e7;
  --deal:#e8590c;--deal-ink:#ffffff;--deal-bg:#fff0e5;
  --hot:#d6332a;--hot-bg:#fdebea;--ok:#1b7a3a;--ok-bg:#e4f3e8;--est:#9a6a00;--est-bg:#fbf1d6;
  --link:#0a62bd;--award:#8a5a00;--award-bg:#fbeec9;--school:#1f4e8c;--school-bg:#e3ecf8;--grower:#3f6a1f;--grower-bg:#e8f1dc;
  --flesh:#f2c14e;--skin:#6f9a3c;--skin-d:#4d7328;--seed:#3b2a17;
  --rb-black:#2b2233;--rb-purple:#7a2d6b;--rb-gold:#e0a526;--rb-red:#c4233a;
  --kw-green:#7fa33a;--kw-red:#9d3346;--kw-flesh:#b9d36a;
  --ps-am:#e08a1e;--ps-hy:#d9571c;--ps-as:#ef7a12;--ps-cap:#5d7a2e;
  --gb-red:#9c2f3f;--gb-pink:#c9607a;--gb-green:#8bb04a;--gb-yellow:#d7b23c;--gb-white:#cfd9a8;--gb-black:#4a2c45;
  --ap-russet:#b9803a;--ap-smooth:#d9cf62;--ap-dot:#7a4d1c;
  --font:"Archivo",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0f151a;--card:#182129;--card2:#1d2730;--hdr:#0a0f13;--hdr2:#131b22;--hdr-line:#27333d;--hdr-ink:#d3dce2;--hdr-dim:#7d8c98;
  --ink:#e6ecf0;--soft:#a1afbb;--faint:#6f7d89;--line:#28343e;
  --deal:#ff7a2e;--deal-ink:#1a0c00;--deal-bg:#3a2211;
  --hot:#ff6b5f;--hot-bg:#3b1a18;--ok:#5fcf7f;--ok-bg:#15301f;--est:#e9bb4d;--est-bg:#372c10;
  --link:#6fb1f2;--award:#f0c35a;--award-bg:#3a2d0f;--school:#8fb8f0;--school-bg:#18283d;--grower:#a5d17a;--grower-bg:#1e2c14;
  --flesh:#e8b640;--skin:#86b457;--skin-d:#5f8a37;--seed:#2a1d0f;
  --rb-black:#6b5a7d;--rb-purple:#b0569f;--rb-gold:#e8b640;--rb-red:#e2505f;
  --kw-green:#9cc259;--kw-red:#d0607a;--kw-flesh:#cfe38a;
  --ps-am:#eea24a;--ps-hy:#f07a45;--ps-as:#f59a3f;--ps-cap:#8fb35a;
  --gb-red:#d0566a;--gb-pink:#e28aa0;--gb-green:#a8cc66;--gb-yellow:#e6c65a;--gb-white:#dfe8b8;--gb-black:#8a6390;
  --ap-russet:#d39a52;--ap-smooth:#e3da78;--ap-dot:#5a3812;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f151a;--card:#182129;--card2:#1d2730;--hdr:#0a0f13;--hdr2:#131b22;--hdr-line:#27333d;--hdr-ink:#d3dce2;--hdr-dim:#7d8c98;
  --ink:#e6ecf0;--soft:#a1afbb;--faint:#6f7d89;--line:#28343e;
  --deal:#ff7a2e;--deal-ink:#1a0c00;--deal-bg:#3a2211;
  --hot:#ff6b5f;--hot-bg:#3b1a18;--ok:#5fcf7f;--ok-bg:#15301f;--est:#e9bb4d;--est-bg:#372c10;
  --link:#6fb1f2;--award:#f0c35a;--award-bg:#3a2d0f;--school:#8fb8f0;--school-bg:#18283d;--grower:#a5d17a;--grower-bg:#1e2c14;
  --flesh:#e8b640;--skin:#86b457;--skin-d:#5f8a37;--seed:#2a1d0f;
  --rb-black:#6b5a7d;--rb-purple:#b0569f;--rb-gold:#e8b640;--rb-red:#e2505f;
  --kw-green:#9cc259;--kw-red:#d0607a;--kw-flesh:#cfe38a;
  --ps-am:#eea24a;--ps-hy:#f07a45;--ps-as:#f59a3f;--ps-cap:#8fb35a;
  --gb-red:#d0566a;--gb-pink:#e28aa0;--gb-green:#a8cc66;--gb-yellow:#e6c65a;--gb-white:#dfe8b8;--gb-black:#8a6390;
  --ap-russet:#d39a52;--ap-smooth:#e3da78;--ap-dot:#5a3812;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--deal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;color:#fff;white-space:nowrap}
.brand b{font-weight:900;font-stretch:118%;font-size:21px;letter-spacing:-.02em}
.brand b span{color:var(--deal)}
.brand svg{width:26px;height:26px;flex:none}
.search{flex:1 1 180px;position:relative;min-width:0}
.search input{width:100%;background:var(--hdr2);border:1px solid var(--hdr-line);border-radius:6px;color:#fff;padding:9px 12px 9px 34px;font-size:14px}
.search input::placeholder{color:var(--hdr-dim)}
.search>svg{position:absolute;z-index:1;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--hdr-dim)}
.shipto{color:var(--hdr-dim);font-size:12.5px;white-space:nowrap}
.shipto b{color:var(--hdr-ink);font-family:var(--mono);font-weight:600}
.zipwrap{position:relative}
button.shipto{background:none;border:1px dashed transparent;border-radius:6px;padding:5px 7px;cursor:pointer;font:inherit;font-size:12.5px}
button.shipto:hover,button.shipto[aria-expanded="true"]{border-color:var(--hdr-line);color:var(--hdr-ink)}
button.shipto .chg{color:var(--deal);font-weight:700;margin-left:4px}
.zipbox{position:absolute;right:0;top:calc(100% + 8px);z-index:40;width:290px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:14px}
.zipbox label{display:block;font-weight:800;font-size:14px;margin-bottom:8px}
.zipbox .row{display:flex;gap:8px}
.zipbox input{flex:1;min-width:0;font:600 16px var(--mono);letter-spacing:.08em;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card2);color:var(--ink)}
.zipbox p{margin:9px 0 0;font-size:12.5px;color:var(--soft);line-height:1.45}
.zipbox .err{color:var(--deal);font-weight:700}
.zipbox .linkbtn{margin-top:8px;font-size:12.5px}
@media (max-width:560px){.zipwrap{flex-basis:100%}.zipbox{left:0;right:auto;width:min(290px,calc(100vw - 32px))}}
.tabs{background:var(--hdr2);border-top:1px solid var(--hdr-line)}
.tabs-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
/* every fruit tab visible: wrap onto a second row on wide screens; on phones scroll sideways, with a fade hinting there's more */
@media (min-width:701px){.tabs-in{flex-wrap:wrap;overflow-x:visible;row-gap:0}}
@media (max-width:700px){.tabs-in{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
  .tabs-in.at-end{-webkit-mask-image:none;mask-image:none}}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--hdr-ink);padding:10px 13px 8px;font-size:13.5px;font-weight:700;white-space:nowrap;cursor:pointer;display:flex;gap:7px;align-items:center}
.tab[aria-selected="true"]{border-bottom-color:var(--deal);color:#fff}
.tab[disabled]{cursor:default;color:var(--hdr-dim)}
.tab small{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--hdr-line);border-radius:3px;padding:0 5px;color:var(--hdr-dim)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 56px}

/* ---------- status strip ---------- */
.status{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:12.5px;color:var(--soft);padding:12px 0 2px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;box-shadow:0 0 0 3px var(--ok-bg)}
.status b{color:var(--ink);font-weight:700}
.status{flex-direction:column;align-items:flex-start;gap:3px;margin-top:14px}
details.status{display:block;margin-top:14px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--card)}
details.status>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px}
details.status>summary::-webkit-details-marker{display:none}
details.status>summary>span:nth-child(2){flex:1;min-width:0}
details.status .more-lbl{color:var(--link);font-weight:600;white-space:nowrap}
details.status .more-lbl::after{content:"";display:inline-block;width:6px;height:6px;margin-left:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
details.status[open] .more-lbl::after{transform:translateY(1px) rotate(-135deg)}
details.status[open]>summary{border-bottom:1px solid var(--line)}
details.status>.run{padding:6px 12px 0;margin:0}
details.status>.run:last-child{padding-bottom:10px}
.zipnote{font-size:12.5px;margin:8px 0 0}
.run{margin:0;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.run .dot{align-self:center}.run-sum{color:var(--soft);flex-basis:100%;padding-left:20px}.run-sum:empty{display:none}
.run.muted{color:var(--faint);font-size:12px}
.scope{font-size:.62em;font-weight:700;font-stretch:100%;letter-spacing:0;vertical-align:middle;background:var(--card2);border:1px solid var(--line);color:var(--soft);border-radius:999px;padding:2px 9px;margin-left:6px;white-space:nowrap}
.filter-note{margin:-2px 0 10px;font-size:12.5px;color:var(--soft)}

/* ---------- frontpage ---------- */
.alertset{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:10px 0 4px;font-size:13px;color:var(--soft)}
.alertset label{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:600}
.alertset label svg{width:15px;height:15px;color:var(--deal)}
.alertset input{width:84px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.alertset button{padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.alertset button[type=submit]{background:var(--deal);border-color:var(--deal);color:var(--deal-ink)}
.alertset .lnk{border:0;background:none;color:var(--link);padding:5px 2px}
.alertset .hint{flex-basis:100%;font-size:12px}
.b.sale{background:var(--deal-bg);color:var(--deal);font-weight:700}
.flag.sale{display:inline-block;margin-top:2px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--deal-bg);color:var(--deal)}
.flag.chk{display:inline-block;margin-top:2px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--est-bg);color:var(--est);cursor:help}
.mission{margin:16px 0 0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--deal);border-radius:8px;padding:16px 18px}
.mission .kicker{margin:0 0 4px;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--deal)}
.mission h2{margin:0 0 6px;font-size:20px;font-weight:900;font-stretch:112%;letter-spacing:-.02em;text-wrap:balance;color:var(--ink)}
.mission p{margin:0;max-width:72ch;font-size:14.5px;line-height:1.55;color:var(--soft)}
.mission p+p{margin-top:6px}
.mission b{color:var(--ink);font-weight:700}
.fp-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:14px 0 10px}
.fp-head h1{margin:0;font-size:22px;font-weight:900;font-stretch:112%;letter-spacing:-.02em;text-wrap:balance}
.fp-head p{margin:0;color:var(--soft);font-size:13px}
.fp{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.deal{background:var(--card);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:74px 1fr;gap:0 12px;padding:12px;cursor:pointer;text-align:left;position:relative}
.deal:hover{border-color:var(--faint)}
.deal .art{grid-row:1/5;width:74px;height:74px;border-radius:6px;background:var(--card2);display:grid;place-items:center}
.deal .art svg{width:52px;height:52px}
.deal .rank{position:absolute;top:-1px;left:-1px;background:var(--deal);color:var(--deal-ink);font:800 11px/1 var(--font);padding:4px 7px;border-radius:8px 0 8px 0}
.deal .nm{font-weight:800;font-size:15.5px;line-height:1.2;letter-spacing:-.01em}
.deal .where{font-size:12.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deal .price-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:4px}
.total{font-weight:900;font-stretch:112%;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.deal .total{font-size:24px;line-height:1}
.t-ok{color:var(--hot)} .t-est{color:var(--est)}
.deal .breakdown{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.deal .why{grid-column:1/-1;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--soft);display:flex;justify-content:space-between;gap:8px;align-items:center}
.heat{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:12.5px;color:var(--hot);white-space:nowrap}
.heat svg{width:13px;height:13px}

/* ---------- badges ---------- */
.bd{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.b{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:3px;padding:2px 6px;line-height:1.25;white-space:nowrap}
.b svg{width:11px;height:11px;flex:none}
.b.award{background:var(--award-bg);color:var(--award)}
.b.school{background:var(--school-bg);color:var(--school)}
.b.grower{background:var(--grower-bg);color:var(--grower)}
.b.new{background:var(--hot-bg);color:var(--hot)}
.b.plain{background:var(--card2);color:var(--soft)}
.b.fruit{background:var(--ink);color:var(--bg)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start;margin-top:26px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}.side{order:2}}
.sec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px;padding-bottom:7px;border-bottom:2px solid var(--deal)}
.sec h2{margin:0;font-size:19px;font-weight:900;font-stretch:108%;letter-spacing:-.01em}
.sec .ct{font-size:13px;color:var(--soft)}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:650;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filters select{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:650}
@media (max-width:560px){.filters select{margin-left:0}}

/* ---------- variety list ---------- */
.list{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rh{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto 18px;gap:4px 14px;align-items:center;padding:10px 14px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.rh:hover{background:var(--card2)}
.rh .art{width:52px;height:52px;border-radius:6px;background:var(--card2);display:grid;place-items:center}
.rh .art svg{width:38px;height:38px}
.rh .nm{font-weight:800;font-size:15.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.rh .sm{font-size:12.5px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rh .sellers{font-size:12px;color:var(--soft);text-align:right;white-space:nowrap}
.rh .best{text-align:right;min-width:92px}
.rh .best .total{font-size:20px;display:block;line-height:1.05}
.rh .best small{font-size:11px;color:var(--faint);display:block}
.chev{width:16px;height:16px;color:var(--faint);transition:transform .15s}
.row.open .chev{transform:rotate(180deg)}
.star{background:none;border:0;padding:2px;cursor:pointer;color:var(--faint);line-height:0}
.star svg{width:16px;height:16px}
.star[aria-pressed="true"]{color:var(--deal)}
@media (max-width:620px){
  .rh{grid-template-columns:44px minmax(0,1fr) auto;padding:10px 12px}
  .rh .art{width:44px;height:44px}.rh .art svg{width:32px;height:32px}
  .rh .sellers,.rh .chev{display:none}
}
.rb{padding:2px 14px 16px 80px}
@media (max-width:620px){.rb{padding:2px 12px 14px}}
.desc{margin:4px 0 12px;font-size:14px;max-width:70ch;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--soft);margin:0 0 12px}
.facts b{color:var(--ink);font-weight:700}

.offers{border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.offers table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.offers th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700;text-align:left;padding:7px 10px;background:var(--card2);border-bottom:1px solid var(--line)}
.offers th.r,.offers td.r{text-align:right}
.offers td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.offers tr:first-child td{border-top:0}
.offers tr.is-best td{background:var(--deal-bg)}
.offers .n{font-weight:750}
.offers .loc{display:block;font-size:11.5px;color:var(--soft);font-weight:400}
.offers .money{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.offers td.total{font-size:15px}
.flag{font-size:10.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 6px;border-radius:3px;white-space:nowrap}
.flag.ok{background:var(--ok-bg);color:var(--ok)}
.flag.est{background:var(--est-bg);color:var(--est)}
.flag.out{background:var(--card2);color:var(--faint)}
.flag.pick{background:var(--school-bg);color:var(--school)}
.flag.tm-safe{background:var(--ok-bg);color:var(--ok)}.flag.tm-ask{background:var(--est-bg);color:var(--est)}.flag.tm-risky{background:var(--hot-bg);color:var(--hot)}.flag.tm-unknown{background:var(--card2);color:var(--faint);border:1px dashed var(--line)}
.offers .tm{display:block;margin-top:4px;font-size:11.5px;color:var(--soft);font-weight:400;max-width:44ch}.offers .tm .flag{margin-right:5px}
.subhead{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.oos{display:flex;flex-wrap:wrap;gap:6px}
.oos a,.oos span{font-size:12px;border:1px dashed var(--line);border-radius:4px;padding:3px 8px;color:var(--soft)}
.more{margin:10px 0 0;font-size:12.5px}
.empty{padding:28px;text-align:center;color:var(--soft)}

/* ---------- side ---------- */
.side{display:flex;flex-direction:column;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.box h3{margin:0 0 8px;font-size:14px;font-weight:850}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .v{font-size:24px;font-weight:900;font-stretch:112%;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--soft)}
.box ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13px}
.box li{display:flex;justify-content:space-between;gap:10px}
.box li span:last-child{color:var(--soft);font-size:12px;white-space:nowrap}
.box p{margin:0 0 6px;font-size:12.5px;color:var(--soft)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--soft)}
.legend .total{font-size:14px}

/* ---------- watchlist ---------- */
.watch{margin-top:30px}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.wc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 12px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 10px}
.wc .art{grid-row:1/4;width:36px;height:36px;border-radius:6px;background:var(--card2);display:grid;place-items:center}
.wc .art svg{width:26px;height:26px;opacity:.55}
.wc .nm{font-weight:800;font-size:14.5px;display:flex;gap:6px;align-items:center}
.wc .sm{font-size:12px;color:var(--soft)}
.wc .last{font-size:12px;color:var(--soft)}
.wc .last b{color:var(--ink);font-family:var(--mono);font-weight:600}
.wc button.link{background:none;border:0;padding:0;color:var(--link);font-size:12px;cursor:pointer;text-align:left}

footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--soft);display:grid;gap:8px;max-width:88ch}
footer p{margin:0}
.loading{padding:60px 0;text-align:center;color:var(--soft)}
@media (prefers-reduced-motion:no-preference){.row.open .rb{animation:rise .16s ease-out}@keyframes rise{from{opacity:.4;transform:translateY(-4px)}}}

/* ---------- wagon ---------- */
.wagon-btn{display:inline-flex;align-items:center;gap:8px;background:var(--hdr2);border:1px solid var(--hdr-line);border-radius:6px;color:#fff;padding:6px 10px 6px 11px;font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap}
.wagon-btn:hover{border-color:var(--hdr-dim)}
.wagon-btn svg{width:26px;height:20px;color:var(--deal)}
.wagon-btn[aria-current="page"]{border-color:var(--deal);background:var(--hdr)}
.wagon-btn .ct{min-width:21px;height:21px;border-radius:999px;background:var(--deal);color:var(--deal-ink);font-size:11.5px;display:inline-grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.wagon-btn .ct[data-n="0"]{background:var(--hdr-line);color:var(--hdr-dim)}
@media (prefers-reduced-motion:no-preference){.wagon-btn.bump .ct{animation:bump .4s ease-out}@keyframes bump{35%{transform:scale(1.4)}}}
.wadd{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 6px;cursor:pointer;color:var(--soft);display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;line-height:1.5;white-space:nowrap;flex:none}
.wadd svg{width:18px;height:14px}
.wadd:hover{border-color:var(--faint);color:var(--ink)}
.wadd[aria-pressed="true"]{background:var(--deal-bg);border-color:var(--deal);color:var(--deal)}
.wadd.big{font-size:13px;padding:6px 14px 6px 10px;margin:0 0 12px}
.wadd.big svg{width:22px;height:17px}
.deal .wadd{position:absolute;top:8px;right:8px;padding:2px 7px 2px 5px}
.deal .nm{padding-right:46px}

.wg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;margin:18px 0 14px}
.wg-head h1{margin:0;font-size:26px;font-weight:900;font-stretch:115%;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.wg-head h1 svg{width:38px;height:30px;color:var(--deal)}
.wg-head p{margin:3px 0 0;color:var(--soft);font-size:13px;max-width:62ch}
.linkbtn{background:none;border:0;padding:0;color:var(--link);cursor:pointer;font-size:13px;font-weight:650}
.linkbtn:hover{text-decoration:underline}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:10px}
.plan{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:11px 14px 12px;text-align:left;cursor:pointer;display:grid;gap:3px}
.plan:hover{border-color:var(--faint)}
.plan[aria-pressed="true"]{border-color:var(--deal);background:var(--deal-bg)}
.plan[disabled]{cursor:default}
.plan .pl{font-size:13px;font-weight:850;display:flex;justify-content:space-between;gap:8px}
.plan .pl span{font-weight:700;color:var(--soft);font-size:12px}
.plan .total{font-size:30px;line-height:1.05}
.plan .pm{font-size:12.5px;color:var(--soft)}
.plan .pm b{color:var(--ok)}
.wg-opts{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--soft);margin:0 0 18px}
.wg-opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.order{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.oh{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;background:var(--card2);border-bottom:1px solid var(--line)}
.oh .step{width:30px;height:30px;border-radius:50%;background:var(--hdr);color:#fff;font-weight:900;display:grid;place-items:center;font-size:14px;grid-row:1/3}
.oh h2{margin:0;font-size:17px;font-weight:900;letter-spacing:-.01em;line-height:1.2}
.oh .loc{font-size:12px;color:var(--soft);grid-column:2}
.oh .ot{grid-row:1/3;grid-column:3;text-align:right}
.oh .ot .total{font-size:22px;display:block;line-height:1.05}
.oh .ot small{font-size:11px;color:var(--faint)}
.it{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:3px 12px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.it:first-child{border-top:0}
.it .art{width:44px;height:44px;border-radius:6px;background:var(--card2);display:grid;place-items:center;grid-row:1/3}
.it .art svg{width:32px;height:32px}
.it .nm{font-weight:800;font-size:15px;line-height:1.25}
.it .nm a{color:inherit}
.it .nm,.it .sm{display:block}
.it .sm{font-size:12px;color:var(--soft)}
.it .line{text-align:right;font-family:var(--mono);font-size:14px;white-space:nowrap;font-weight:600}
.it .line small{display:block;font-size:11px;color:var(--faint);font-weight:400}
.it .ctl{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;margin-top:4px}
@media (max-width:520px){.it .ctl{grid-column:1/-1}}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.qty button{background:none;border:0;width:28px;height:26px;cursor:pointer;font-weight:800;font-size:15px;color:var(--soft);border-radius:999px}
.qty button:hover{color:var(--ink);background:var(--card2)}
.qty span{min-width:20px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.it select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 9px;font-size:12px;max-width:100%;min-width:0}
.rm{background:none;border:0;color:var(--faint);cursor:pointer;font-size:12px;padding:0;text-decoration:underline;text-underline-offset:2px}
.rm:hover{color:var(--hot)}
.osum{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:3px;font-size:13px;background:var(--card2)}
.osum div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.osum .money{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.osum .tt{font-weight:900;font-size:15px;color:var(--ink)}
.osum .sv{color:var(--ok)}
.how{padding:12px 14px 14px;border-top:1px solid var(--line);font-size:13.5px}
.how h3{margin:0 0 6px;font-size:13.5px;font-weight:850}
.how ol{margin:0;padding-left:20px;display:grid;gap:5px}
.how li::marker{font-weight:800;color:var(--faint)}
.how .note{color:var(--soft);font-size:12.5px;margin:9px 0 0}
.codes{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 2px}
.code{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--deal);border-radius:6px;padding:3px 4px 3px 9px;background:var(--deal-bg);font-size:12px;color:var(--soft)}
.code b{font-family:var(--mono);font-weight:600;color:var(--ink);letter-spacing:.03em;font-size:12.5px;user-select:all}
.code button{background:var(--deal);color:var(--deal-ink);border:0;border-radius:4px;padding:3px 8px;font-size:11px;font-weight:800;cursor:pointer}
.wg-empty{background:var(--card);border:1px dashed var(--faint);border-radius:8px;padding:40px 20px;text-align:center;color:var(--soft)}
.wg-empty svg{width:84px;height:64px;color:var(--faint)}
.wg-empty b{display:block;color:var(--ink);font-size:18px;margin:8px 0 4px}
.wg-empty p{margin:0 auto 16px;max-width:44ch}
.btn{background:var(--deal);color:var(--deal-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:800;cursor:pointer;font-size:13.5px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.listtxt{width:100%;min-height:150px;font:12px/1.5 var(--mono);border:1px solid var(--line);border-radius:6px;background:var(--card2);color:var(--ink);padding:9px;resize:vertical}
.parked .it{opacity:.75}
.flag.cpn{background:var(--deal-bg);color:var(--deal)}

/* ---------- my garden ---------- */
.hdr-btns{display:flex;gap:8px}
.garden-btn svg{color:#7cc46a}
.garden-btn .ct{background:#3f7d2c;color:#fff}
.b.own{background:#e3f1dc;color:#2f6a1d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b.own{background:#1f3318;color:#a5d17a}}
:root[data-theme="dark"] .b.own{background:#1f3318;color:#a5d17a}
.fp-skip{margin:-4px 0 10px;font-size:12.5px;color:var(--soft)}
.g-add{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}
.g-add h2{margin:0 0 4px;font-size:16px;font-weight:900}
.g-add p{margin:0 0 10px;font-size:12.5px;color:var(--soft)}
.g-add input[type=search]{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:6px;padding:10px 12px;font-size:15px}
.g-sug{display:flex;flex-direction:column;margin-top:8px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.g-sug:empty{display:none}
.g-sug button{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--card);border:0;border-top:1px solid var(--line);padding:7px 10px;cursor:pointer}
.g-sug button:first-child{border-top:0}
.g-sug button:hover,.g-sug button:focus-visible{background:var(--card2)}
.g-sug .art svg{width:28px;height:28px}
.g-sug .nm{font-weight:800;font-size:14px}
.g-sug .sm{font-size:12px;color:var(--soft)}
.g-sug .act{font-size:12px;font-weight:800;color:var(--deal);white-space:nowrap}
.g-sug .own{color:var(--faint)}
.g-custom{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px 10px;background:var(--card2);font-size:13px}
.g-custom select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 9px;font-size:12.5px}
.g-fruit{margin-bottom:16px}
.g-fruit h3{margin:0 0 6px;font-size:15px;font-weight:900;display:flex;gap:8px;align-items:baseline}
.g-fruit h3 span{font-size:12px;font-weight:600;color:var(--soft)}
.g-list{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.g-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:start}
.g-row:first-child{border-top:0}
.g-row .art{width:44px;height:44px;border-radius:6px;background:var(--card2);display:grid;place-items:center;grid-row:1/3}
.g-row .art svg{width:32px;height:32px}
.g-row .nm{font-weight:800;font-size:15px;display:block}
.g-row .nm a{color:inherit}
.g-row .sm{font-size:12px;color:var(--soft);display:block}
.g-row .ctl{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--soft);margin-top:4px}
@media (max-width:520px){.g-row .ctl{grid-column:1/-1}}
.g-row input{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 8px;font-size:12.5px}
.g-row input.yr{width:74px}
.g-row input.note{flex:1 1 180px;min-width:0}
.g-row .stock{font-size:12px;text-align:right;white-space:nowrap}
.g-row .stock .total{font-size:15px;display:block}
.hint{border-left:3px solid var(--deal);padding:2px 0 2px 10px;margin:0 0 12px}
.hint b{color:var(--ink)}
.hint ul{margin:5px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.hint li{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px}
.mini{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.mini .art{width:36px;height:36px;border-radius:6px;background:var(--card2);display:grid;place-items:center;grid-row:1/3}
.mini .art svg{width:26px;height:26px}
.mini .nm{font-weight:800;font-size:13.5px}
.mini .nm a{color:inherit}
.mini .sm{font-size:11.5px;color:var(--soft);grid-column:2}
.mini .total{font-size:15px;grid-row:1/3;grid-column:3;text-align:right}

/* ---------- predictive search ---------- */
.search .ghost{position:absolute;left:0;right:0;top:0;bottom:0;padding:9px 12px 9px 34px;font-size:14px;white-space:pre;overflow:hidden;pointer-events:none;color:var(--hdr-dim);border:1px solid transparent;line-height:normal;font-family:inherit}
.search .ghost i{font-style:normal;color:transparent}
.search input{position:relative;background:transparent}
.search{background:var(--hdr2);border-radius:6px}
.qsug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:60;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.28);overflow:auto;max-height:min(420px,60vh);padding:4px 0}
.qsug[hidden]{display:none}
.qsug .grp{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:8px 12px 3px}
.qsug [role=option]{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 12px;cursor:pointer}
.qsug [role=option][aria-selected=true]{background:var(--deal-bg)}
.qsug .ic{width:28px;height:28px;border-radius:6px;background:var(--card2);display:grid;place-items:center;font-size:14px;color:var(--soft)}
.qsug .ic svg{width:24px;height:24px}
.qsug .lb{font-size:14px;font-weight:650;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qsug .lb b{font-weight:900}
.qsug .lb small{display:block;font-size:11.5px;font-weight:500;color:var(--soft);overflow:hidden;text-overflow:ellipsis}
.qsug .rt{font-size:12.5px;white-space:nowrap;text-align:right}
.qsug .rt .total{font-size:14px}
.qsug .rt.dim{color:var(--faint);font-size:11.5px}
.qsug .foot{font-size:11px;color:var(--faint);padding:6px 12px 4px;border-top:1px solid var(--line);margin-top:4px}
@media (hover:none){.qsug .foot{display:none}}
.search input,.search .ghost{font-family:inherit;letter-spacing:normal}
/* ---------- price history ---------- */
.b.low{background:var(--deal-bg);color:var(--deal)}
.b.drop{background:var(--ok-bg);color:var(--ok)}
.b.back{background:var(--school-bg);color:var(--school)}
.b svg[viewBox="0 0 10 10"]{width:9px;height:9px}
.trend{display:inline-flex;align-items:center;gap:5px;justify-content:flex-end;background:none;border:0;padding:2px 0 0;cursor:pointer;font:700 11.5px var(--font);color:var(--soft);white-space:nowrap;margin-left:auto}
.trend .spark{color:var(--faint)}
.trend span{display:inline-flex;align-items:center;gap:2px}
.trend span svg{width:9px;height:9px}
.trend.dn span{color:var(--ok)}.trend.up span{color:var(--hot)}
.trend.dn .spark{color:var(--ok)}.trend.up .spark{color:var(--hot)}
.trend:hover span{text-decoration:underline}
.rh .best .trend{display:flex}
.hist-btn svg{color:#8fb8f0;width:22px!important;height:20px!important}
.sales-btn svg{color:#ff9a5a;width:21px!important;height:21px!important}
.sales-btn .ct[data-n="0"]{display:none}
.b.drop{background:var(--ok-bg);color:var(--ok);font-weight:700}.b.drop svg{width:8px;height:8px}
.tile.static{cursor:default}
.sl-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto auto;gap:4px 16px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.sl-row:first-child{border-top:0}
.sl-row .art{width:44px;height:44px}
.sl-main{min-width:0;display:grid;gap:2px}
.sl-main .nm{font-weight:800;color:var(--ink);text-decoration:none;font-size:15px}.sl-main .nm:hover{text-decoration:underline}
.sl-where{font-size:12.5px;color:var(--soft)}
.sl-price{display:grid;justify-items:end;font-variant-numeric:tabular-nums;line-height:1.2}
.sl-price b{font-size:17px;color:var(--ink)}.sl-price s{font-size:12.5px;color:var(--soft)}.sl-price em{font-style:normal;font-size:12px;font-weight:700;color:var(--deal)}
.sl-total{display:grid;justify-items:end;line-height:1.2}.sl-total .total{font-size:15px}.sl-total small{font-size:11px;color:var(--soft)}
.sl-act{display:flex;align-items:center;gap:8px}
.sl-buy{font-size:13px;font-weight:700;color:var(--link);text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.sl-buy:hover{border-color:var(--link)}
@media (max-width:700px){
  .sl-row{grid-template-columns:40px minmax(0,1fr) auto;padding:10px 12px}
  .sl-row .art{width:40px;height:40px}
  .sl-total{grid-column:2;justify-items:start;display:flex;gap:6px;align-items:baseline}
  .sl-act{grid-column:3}
}
.deals-btn svg{width:20px!important;height:20px!important}
@media (max-width:560px){
  .hdr-btns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%}
  .hdr-btns .wagon-btn{flex-direction:column;justify-content:center;padding:6px 2px 5px;gap:2px;font-size:11px;line-height:1.1;position:relative;min-width:0}
  .hdr-btns .wagon-btn .lbl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .hdr-btns .wagon-btn svg{width:19px!important;height:19px!important}
  .hdr-btns .wagon-btn .ct{position:absolute;top:3px;right:4px;font-size:10px;min-width:16px;padding:0 4px;line-height:15px}
}
.ph-ic svg{width:32px;height:32px;color:var(--deal)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px;text-align:left;cursor:pointer;display:grid;gap:2px}
.tile:hover{border-color:var(--faint)}
.tile.on{border-color:var(--deal);box-shadow:inset 0 0 0 1px var(--deal)}
.tile .v{font-size:26px;font-weight:900;font-stretch:112%;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile .l{font-size:12px;color:var(--soft)}
.ph-row{border-top:1px solid var(--line)}
.ph-row:first-child{border-top:0}
.ph-h{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto 84px 18px;gap:4px 14px;align-items:center;padding:10px 14px;cursor:pointer}
.ph-h:hover{background:var(--card2)}
.ph-h .art{width:44px;height:44px;border-radius:6px;background:var(--card2);display:grid;place-items:center}
.ph-h .art svg{width:32px;height:32px}
.ph-h .nm{font-weight:800;font-size:15px;letter-spacing:-.01em}

/* ================= simpler layout (Nov 2026): one nav row, fruit tiles, short rows, seller cards, tap-for-help tips ================= */

<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => n == null ? "—" : "$" + (Math.round(n * 100) / 100).toFixed(Math.abs(n % 1) > 0.001 ? 2 : 0);
const moneyR = (lo, hi) => Math.abs(lo - hi) < 0.005 ? money(lo) : `${money(lo)}–${money(hi).slice(1)}`;
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = iso => { if (!iso) return ""; const [y,m,d] = iso.split("-").map(Number); return `${MON[m-1]} ${d}`; };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const clamp = (x, a, z) => Math.max(a, Math.min(z, x));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ---------------------------------------------------------------- the owner's watch list, alerts, garden and wagon, synced
// For the board's owner, stars, alert prices, garden and wagon live in the board's own database (one private
// document, owner/state) so they follow them across devices and the nightly check can read them to send alerts.
// Everyone else keeps them in this browser only. Nothing here blocks the first paint.
const SYNC = { on: false, ref: null, last: "" };
const SYNC_KEYS = new Set(["rfd.starred2", "rfd.targets", "rfd.garden", "rfd.wagon"]);
const localSet = store.set.bind(store);
store.set = (k, v) => { localSet(k, v); if (SYNC_KEYS.has(k)) syncPush(); };
const syncState = () => ({ starred: [...S.starred].sort(), targets: S.targets, garden: GKEEP, wagon: W.items });
let syncTimer = null;
function syncPush() {
  if (!SYNC.on) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    const body = syncState(), j = JSON.stringify(body);
    if (j === SYNC.last) return;
    SYNC.last = j;
    try { await SYNC.ref.set({ ...JSON.parse(j), updated: new Date().toISOString() }); } catch (e) { console.warn("sync write failed", e?.code || e); }
  }, 700);
}
function syncApply(d, merge) {
  let starred = d.starred || [], targets = { ...(d.targets || {}) }, garden = (d.garden || []).slice(), wagon = (d.wagon || []).slice();
  if (merge) {   // first load on this device: keep anything only this browser had
    starred = [...new Set([...starred, ...S.starred])];
    for (const [k, t] of Object.entries(S.targets)) if (!(k in targets)) targets[k] = t;
    const gk = it => it.key || "name:" + norm(it.name);
    for (const it of G.items) if (!garden.some(x => gk(x) === gk(it))) garden.push(it);
    for (const it of W.items) if (!wagon.some(x => x.key === it.key)) wagon.push(it);
  }
  const next = { starred: [...starred].sort(), targets, garden, wagon };
  const j = JSON.stringify(next);
  if (j === JSON.stringify(syncState())) { if (!merge) SYNC.last = j; return false; }
  S.starred = new Set(starred); S.targets = targets; GKEEP = garden; W.items = wagon;
  localSet("rfd.starred2", next.starred); localSet("rfd.targets", targets); localSet("rfd.garden", garden); localSet("rfd.wagon", wagon);
  if (!merge) SYNC.last = j;
  OWNED = ownedSet(); updateGardenBtn(); updateWagonBtn();
  return true;
}
async function syncInit() {
  try {
    if (!window.claude?.use) return;
    const user = await claude.use("user");
    if (!user || !(await user.isOwner())) return;
    const db = await claude.use("db"); if (!db) return;
    SYNC.ref = db.doc("owner/state");
    const first = await SYNC.ref.get();
    SYNC.on = true;
    if (first.exists) syncApply(first.data(), true);
    syncPush();   // seeds the document, or saves what this device added
    SYNC.ref.onSnapshot(snap => { if (snap.exists && !snap.metadata.hasPendingWrites && syncApply(snap.data(), false)) render(); },
                        e => console.warn("sync listener stopped", e?.code));
    render();
  } catch (e) { console.warn("sync unavailable", e?.code || e); }
}
// Fruits seeded from chat before they have a nightly data file. If fruits.json later lists the same id, that wins.
const INLINE_FRUITS = {};
const DATA_BASE = document.querySelector('meta[name="rfd-data-base"]')?.content || "data/";

const ICON = {
  tag: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1 1.5h4.6L11 6.9 6.9 11 1.5 5.6V1.5zM3.4 3.4h.01" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>',
  bell: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a4 4 0 00-4 4v2.8L2.6 11h10.8L12 8.3V5.5a4 4 0 00-4-4zM6.3 12.5a1.7 1.7 0 003.4 0" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>',
  award: '<svg viewBox="0 0 12 12"><path d="M3 1h6v3a3 3 0 01-6 0zM1.5 1.5H3v1.5a1.5 1.5 0 01-1.5-1.5zM10.5 1.5H9v1.5a1.5 1.5 0 001.5-1.5zM5 7h2v2h1.5v1.5h-5V9H5z" fill="currentColor"/></svg>',
  school: '<svg viewBox="0 0 12 12"><path d="M6 1L.5 4 6 7l5.5-3zM2.5 5.3v2.5C3.5 9 4.7 9.5 6 9.5s2.5-.5 3.5-1.7V5.3L6 7.3z" fill="currentColor"/></svg>',
  grower: '<svg viewBox="0 0 12 12"><path d="M6 11V6M6 6C6 3 8 1.5 11 1.5 11 4.5 9 6 6 6zM6 7.5C6 5.5 4.5 4 1.5 4 1.5 6 3 7.5 6 7.5z" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>',
  flame: '<svg viewBox="0 0 14 14"><path d="M7 1c.5 2.5 3.5 3.8 3.5 7.2A3.5 3.5 0 017 12a3.5 3.5 0 01-3.5-3.8C3.5 6.5 5 5.6 5.4 4c.9.9 1.2 2 1.1 3C7.7 5.8 7.6 3 7 1z" fill="currentColor"/></svg>',
  star: '<svg viewBox="0 0 16 16"><path d="M8 1.5l1.9 4.1 4.4.5-3.3 3 .9 4.4L8 11.3l-3.9 2.2.9-4.4-3.3-3 4.4-.5z" fill="currentColor"/></svg>',
  starO: '<svg viewBox="0 0 16 16"><path d="M8 1.5l1.9 4.1 4.4.5-3.3 3 .9 4.4L8 11.3l-3.9 2.2.9-4.4-3.3-3 4.4-.5z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

// ---------------------------------------------------------------- fruit artwork (one entry per fruit; new fruits fall back to `generic`)
const hash = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const ART = {
  pawpaw(v, cut) {
    const h = hash(v.id), ry = Math.min(17 * (1 + (h % 7) / 18), 20), tilt = (h % 13) - 6, seeds = 2 + (h % 3);
    let s = `<g transform="rotate(${tilt} 24 24)"><ellipse cx="24" cy="25" rx="13" ry="${ry}" fill="var(--skin)"/>`;
    if (cut) { s += `<ellipse cx="24" cy="25" rx="9.8" ry="${ry - 3.2}" fill="var(--flesh)"/>`;
      for (let i = 0; i < seeds; i++) s += `<ellipse cx="${24 + (i % 2 ? 2.4 : -2.4)}" cy="${25 + (i - (seeds - 1) / 2) * 7.5}" rx="2.3" ry="3.4" fill="var(--seed)"/>`; }
    return s + `<path d="M24 ${25 - ry}c0-3 1.5-4.5 4-5" stroke="var(--skin-d)" stroke-width="2" fill="none" stroke-linecap="round"/></g>`;
  },
  raspberry(v) {
    const col = { black: "var(--rb-black)", purple: "var(--rb-purple)", gold: "var(--rb-gold)", red: "var(--rb-red)" }[v.color] || "var(--rb-red)";
    const h = hash(v.id), rows = [[24], [18, 30], [13, 24, 35], [18, 30], [24]], r = 5.4 + (h % 3) * 0.3;
    let s = `<g transform="rotate(${(h % 11) - 5} 24 26)">`;
    rows.forEach((xs, i) => xs.forEach(x => { s += `<circle cx="${x}" cy="${14 + i * 7.2}" r="${r}" fill="${col}"/><circle cx="${x - 1.4}" cy="${12.6 + i * 7.2}" r="1.3" fill="#fff" opacity=".28"/>`; }));
    return s + `<path d="M24 9V3M19 6.5h10" stroke="var(--skin-d)" stroke-width="2" stroke-linecap="round"/></g>`;
  },
  kiwi(v, cut) {
    const h = hash(v.id), col = v.color === "red" ? "var(--kw-red)" : "var(--kw-green)", small = v.species === "kolomikta" || v.species === "polygama";
    const r = small ? 7 : 9, pts = v.sex === "male" ? [[24, 26]] : [[17, 30], [30, 29], [24, 18]];
    let s = `<g transform="rotate(${(h % 13) - 6} 24 26)"><path d="M24 6c0 4-2 7-6 9M24 6c1 5 3 8 7 9" stroke="var(--skin-d)" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
    if (v.sex === "male") s += `<g fill="#fff" stroke="var(--skin-d)" stroke-width="1"><circle cx="24" cy="18" r="4.5"/><circle cx="18" cy="24" r="4.5"/><circle cx="30" cy="24" r="4.5"/><circle cx="20.5" cy="31" r="4.5"/><circle cx="27.5" cy="31" r="4.5"/></g><circle cx="24" cy="25.5" r="3.4" fill="var(--flesh)"/>`;
    else pts.forEach(([x, y], i) => { s += `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 1.18}" fill="${col}"/>`; if (cut && i === pts.length - 1) s += `<ellipse cx="${x}" cy="${y}" rx="${r * .62}" ry="${r * .74}" fill="var(--kw-flesh)"/><circle cx="${x}" cy="${y}" r="1.6" fill="#f4f1dc"/>`; });
    return s + "</g>";
  },
  persimmon(v, cut) {
    const h = hash(v.id), col = { american: "var(--ps-am)", hybrid: "var(--ps-hy)", asian: "var(--ps-as)" }[v.type] || "var(--ps-am)";
    const rx = v.type === "american" ? 12.5 : 15.5, ry = v.type === "asian" ? 12.5 : 12;
    let s = `<g transform="rotate(${(h % 11) - 5} 24 26)"><ellipse cx="24" cy="28" rx="${rx}" ry="${ry}" fill="${col}"/><ellipse cx="${24 - rx * .35}" cy="${28 - ry * .4}" rx="${rx * .25}" ry="${ry * .18}" fill="#fff" opacity=".25"/>`;
    s += `<path d="M24 16.5l-6.5-3.5 3 5.2zM24 16.5l6.5-3.5-3 5.2zM24 16.5l-4 5.5 4-1.5 4 1.5z" fill="var(--ps-cap)"/><path d="M24 16.5v-5" stroke="var(--skin-d)" stroke-width="2" stroke-linecap="round"/>`;
    return s + "</g>";
  },
  gooseberry(v, cut) {
    const h = hash(v.id), col = `var(--gb-${["red", "pink", "green", "yellow", "white", "black"].includes(v.color) ? v.color : "green"})`;
    const josta = (v.tags || []).includes("Gooseberry × currant"), r = josta ? 7.5 : 11;
    const pts = josta ? [[16, 30], [28, 32], [23, 20]] : [[24, 28]];
    let s = `<g transform="rotate(${(h % 13) - 6} 24 26)"><path d="M24 4c-1 4-3 7-7 9" stroke="var(--skin-d)" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    pts.forEach(([x, y]) => {
      s += `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 1.1}" fill="${col}"/>`;
      if (!josta) s += `<g stroke="#fff" stroke-opacity=".35" stroke-width="1" fill="none"><path d="M${x} ${y - r * 1.05}v${r * 2.1}"/><path d="M${x - r * .5} ${y - r * .95}q-3 ${r} 0 ${r * 1.9}"/><path d="M${x + r * .5} ${y - r * .95}q3 ${r} 0 ${r * 1.9}"/></g>`;
      s += `<ellipse cx="${x - r * .35}" cy="${y - r * .4}" rx="${r * .22}" ry="${r * .16}" fill="#fff" opacity=".3"/>`;
    });
    if (!josta) s += `<path d="M22 39.5l2 3 2-3" stroke="var(--seed)" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M24 17v-4" stroke="var(--skin-d)" stroke-width="1.8" stroke-linecap="round"/>`;
    return s + "</g>";
  },
  grape(v) {
    const h = hash(v.id), col = { blue: "#4b3a7a", red: "#a8324f", green: "#9fc15a", black: "#2a1f3d" }[v.color] || "#4b3a7a";
    const rows = [[13, 21, 29, 37], [17, 25, 33], [21, 29], [25]], r = 5.3;
    let s = `<g transform="rotate(${(h % 11) - 5} 24 26)"><path d="M24 9c0-3 1-4.5 3-6M24 9c-3-1-6-.5-8 2" stroke="var(--skin-d)" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
    rows.forEach((xs, i) => xs.forEach(x => { s += `<circle cx="${x}" cy="${15 + i * 7.6}" r="${r}" fill="${col}"/><circle cx="${x - 1.5}" cy="${13.4 + i * 7.6}" r="1.4" fill="#fff" opacity=".3"/>`; }));
    return s + "</g>";
  },
  cornelian(v) {
    const h = hash(v.id), col = { red: "#b3122e", dark: "#4a0f1f", yellow: "#e6a91f", coral: "#e0472f" }[v.color] || "#b3122e";
    const hi = v.color === "yellow" ? "#fff6c8" : "#fff";
    let s = `<g transform="rotate(${(h % 11) - 5} 24 24)"><path d="M24 4c-2 5-6 9-9 13M24 4c2 6 5 10 9 12" stroke="var(--skin-d)" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
    for (const [x, y, r] of [[15, 29, -12], [33, 28, 10]]) {
      s += `<g transform="rotate(${r} ${x} ${y})"><ellipse cx="${x}" cy="${y}" rx="6.6" ry="10.2" fill="${col}"/><ellipse cx="${x - 2.2}" cy="${y - 4}" rx="1.7" ry="3" fill="${hi}" opacity=".35"/><circle cx="${x}" cy="${y + 9.6}" r="1" fill="var(--seed)" opacity=".6"/></g>`;
    }
    return s + `<path d="M15 19l0-2M33 18l0-2" stroke="var(--skin-d)" stroke-width="1.4" stroke-linecap="round"/></g>`;
  },
  honeyberry(v) {
    const h = hash(v.id), late = v.bloom === "Late bloomer";
    let s = `<g transform="rotate(${(h % 13) - 6} 24 24)"><path d="M24 5c-3 4-7 7-11 9M24 5c3 5 6 8 11 9" stroke="var(--skin-d)" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
    const pts = late ? [[16, 28, -14, 6.4, 11], [32, 27, 12, 6.8, 10.4]] : [[15, 29, -16, 5.4, 12.5], [25, 30, 0, 5.6, 13], [34, 28, 16, 5.2, 12]];
    for (const [x, y, r, rx, ry] of pts) s += `<g transform="rotate(${r} ${x} ${y})"><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#3d4f8f"/><ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#b8c6e6" opacity=".28"/><ellipse cx="${x - rx * .35}" cy="${y - ry * .35}" rx="${rx * .25}" ry="${ry * .3}" fill="#fff" opacity=".3"/><path d="M${x - 1.6} ${y + ry - .6}l1.6 1.8 1.6-1.8" stroke="#2a3566" stroke-width="1.1" fill="none"/></g>`;
    return s + "</g>";
  },
  asianpear(v) {
    const h = hash(v.id), col = v.skin === "smooth" ? "var(--ap-smooth)" : "var(--ap-russet)";
    let s = `<g transform="rotate(${(h % 11) - 5} 24 26)">`;
    if (v.type === "chinese") s += `<path d="M24 12c-4 0-5 4-5 8 0 3-7 6-7 13 0 6 5 10 12 10s12-4 12-10c0-7-7-10-7-13 0-4-1-8-5-8z" fill="${col}"/>`;
    else s += `<circle cx="24" cy="28" r="14" fill="${col}"/>`;
    s += `<g fill="var(--ap-dot)" opacity=".45">${[[18,24],[28,22],[22,32],[31,31],[16,33],[26,37]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r=".9"/>`).join("")}</g>`;
    s += `<ellipse cx="19" cy="22" rx="3" ry="2" fill="#fff" opacity=".28"/><path d="M24 14V7" stroke="var(--skin-d)" stroke-width="2" stroke-linecap="round"/><path d="M24 9c3-3 7-3 9-1-3 2-6 2-9 1z" fill="var(--skin)"/>`;
    return s + "</g>";
  },
  fig(v, cut) {
    const h = hash(v.id), col = { dark: "#4b2747", brown: "#7a5236", green: "#8aa84a", yellow: "#cdb84c" }[v.color] || "#4b2747";
    const tilt = (h % 13) - 6, small = (v.tags || []).includes("Compact");

const S = { fruit: "all", q: "", f: new Set(store.get("rfd.filters", []).filter(k => k !== "notmine")), forms: new Set(store.get("rfd.forms", [])), sort: store.get("rfd.sort", "deal"), open: null, starred: new Set(store.get("rfd.starred2", [])), targets: store.get("rfd.targets", {}) || {}, statusOpen: !!store.get("rfd.statusOpen", false) };
const FILTERS = [
  ["watched", "★ Watching"], ["confirmed", "Confirmed total"], ["award", "Award winners"], ["pedigree", "Famous breeder / university"],
  ["budget", "Budget price"], ["new", "New this week"], ["shipsnow", "Ships to you"], ["drops", "Price drops"], ["sale", "On sale"],
];

// A price check sometimes saves a note as plain text instead of a list; accept both so one odd entry can't blank the page.
const asList = x => Array.isArray(x) ? x : x == null || x === "" ? [] : [String(x)];
function prepare(fruit, fd) {
  fd.varieties = fd.varieties || []; fd.listings = fd.listings || [];
  for (const o of [...fd.varieties, ...fd.listings, ...(fd.nurseries || [])]) { if (o.notes != null) o.notes = asList(o.notes); }
  for (const v of fd.varieties) { for (const k of ["aliases", "awards", "tags"]) if (v[k] != null) v[k] = asList(v[k]); }
  const today = fd.last_run?.date || fd.updated;
  const nurseries = Object.fromEntries((fd.nurseries || []).map(n => [n.id, n]));
  const vs = fd.varieties.map(v => ({ ...v, fruit: fruit.id, F: fruit, key: `${fruit.id}.${v.id}`, offers: [], out: [] }));
  const byId = Object.fromEntries(vs.map(v => [v.id, v]));
  for (const l of fd.listings) {
    const v = byId[l.variety]; if (!v) continue;
    (l.status === "in_stock" ? v.offers : v.out).push(priceOffer(l, nurseries));
  }
  // a price far below what other sellers charge is usually a tiny size (liner, plug) or a misread page; a nursery whose
  // pages haven't shown a readable price for two or more nights may be out of date. Neither ranks as a deal.
  for (const v of vs) {
    const all = [...v.offers, ...v.out];
    for (const o of all) {
      const others = all.filter(x => x !== o && x.price != null).map(x => x.price).sort((a, b) => a - b), k = others.length;
      const med = k >= 2 ? (k % 2 ? others[(k - 1) / 2] : (others[k / 2 - 1] + others[k / 2]) / 2) : null;
      if (o.price != null && med && o.price < 0.3 * med && o.price < 0.5 * others[1]) o.suspect = `Much cheaper than other sellers (typically ${money(Math.round(med))}): usually a small size such as a liner or plug, or a misread price. Check the size before ordering.`;
      const u = o.n?.unreadable;
      if (!o.suspect && u && (u.nights || 0) >= 2) o.suspect = `${o.n.name}'s page hasn't shown a readable price since ${fmtDate(u.since)}, so this price may be out of date.`;
    }
  }
  const mids = {};
  for (const v of vs) {
    v.offers.sort((a, b) => (!!a.suspect - !!b.suspect) || (a.mid ?? 1e9) - (b.mid ?? 1e9) || (b.ok - a.ok));
    v.best = v.offers[0] || null;
    v.inStock = v.offers.length > 0;
    v.newest = v.offers.map(o => o.first_seen).sort().pop();
    v.fresh = v.offers.some(o => o.first_seen && daysBetween(o.first_seen, today) <= 3);
    if (v.best?.mid != null) (mids[v.sold || ""] ||= []).push(v.best.mid);
    v.lastSeen = v.out.filter(o => o.price != null).sort((a, b) => a.price - b.price)[0] || null;
  }
  const medians = {};
  for (const [g, a] of Object.entries(mids)) { a.sort((x, y) => x - y); medians[g] = a[Math.floor(a.length / 2)]; }
  const allMids = Object.values(mids).flat().sort((a, b) => a - b);
  for (const v of vs) {
    if (!v.best) { v.score = -1; v.why = []; continue; }
    const median = medians[v.sold || ""] || 50;
    const b = v.best, next = v.offers.slice(1).find(o => o.mid != null);
    v.vsFruit = median - b.mid;
    v.savings = next ? Math.max(0, next.mid - b.mid) : 0;
    let s = 35 + clamp(v.vsFruit / median, -0.5, 0.5) * 60 + (next ? clamp(v.savings / b.mid, 0, 0.5) * 30 : 0);
    if (b.ok) s += 12; if (b.price_confirmed === false) s -= 15; if (b.suspect) s -= 25; if (b.sale) s += 5;
    if (v.awards?.length) s += 8; if (v.breeder) s += 4; if (v.fresh) s += 4;
    if (v.offers.length === 1) s += 3;   // one seller: scarce
    if (b.pickup) s -= 8;                // needs a drive
    if (v.sex === "male") s -= 12;      // pollinator: useful, but not a headline deal
    v.score = Math.round(clamp(s, 1, 99));
    v.why = [];
    if (b.sale && !b.suspect) v.why.push(b.sale.was ? `On sale, ${money(Math.round(b.sale.was - b.price))} off` : "On sale");
    if (b.suspect) v.why.push("Check price");
    else if (b.ok) v.why.push(b.pickup ? "Firm price, no shipping" : "Price + shipping confirmed");
    if (next && v.savings >= 3) v.why.push(`${money(Math.round(v.savings))} less than the next seller`);
    else if (v.vsFruit >= 5) v.why.push(`${money(Math.round(v.vsFruit))} under the typical ${money(Math.round(median))}`);
    if (v.awards?.length) v.why.push("Award winner");
    if (v.offers.length === 1) v.why.push("Only 1 seller");
  }
  const liveVs = vs.filter(v => v.inStock);
  D.meta[fruit.id] = { fd, median: allMids[Math.floor(allMids.length / 2)] || 50, today, nurseries, allFresh: liveVs.length > 5 && liveVs.every(v => v.fresh) };
  return vs;
}

// ---------------------------------------------------------------- render bits
const fruitChip = v => `<span class="b fruit">${esc(v.F.name)}</span>`;
function badges(v, compact) {
  const out = [];
  if (compact !== "nofruit") { const fc = fruitChip(v); if (fc) out.push(fc); }
  if (owns(v.key)) out.push(`<span class="b own">${ICON.grower}In your garden</span>`);
  for (const a of v.awards || []) out.push(`<span class="b award" data-tip="${esc(a)}">${ICON.award}${compact ? "Award" : esc(a.length > 34 ? "Award winner" : a)}</span>`);
  if (v.breeder) {
    const uni = v.breeder.kind === "university", short = v.breeder.short || (uni && /Kentucky State/.test(v.breeder.name) ? "KSU" : uni && /Cornell/.test(v.breeder.name) ? "Cornell" : v.breeder.name);
    out.push(`<span class="b ${uni ? "school" : "grower"}" data-tip="${esc((uni ? "University release: " : "Breeder: ") + v.breeder.name)}">${uni ? ICON.school : ICON.grower}${esc(compact ? short : v.breeder.name)}</span>`);
  }
  for (const t of v.tags || []) out.push(`<span class="b plain">${esc(t)}</span>`);
  if (v.fresh) out.push(`<span class="b new">New seller ${fmtDate(v.newest)}</span>`);
  const so = v.best?.sale ? v.best : v.offers.find(o => o.sale);
  if (so) out.push(`<span class="b sale" data-tip="${esc(`${so.n.name} has it on sale${so.sale.was ? `: ${money(so.price)}, regularly ${money(so.sale.was)}` : ""}`)}">${ICON.tag}${so.sale.pct ? `On sale −${so.sale.pct}%` : "On sale"}${!compact && so !== v.best ? ` at ${esc(so.n.name)}` : ""}</span>`);
  if (compact !== "nofruit" && v.inStock) out.push(...priceBadges(v, compact));
  return out.length ? `<div class="bd">${out.join("")}</div>` : "";
}
const totalHTML = o => o.lo == null ? `<span class="total t-est">call</span>` : `<span class="total ${o.ok ? "t-ok" : "t-est"}">${o.ok ? "" : "~"}${moneyR(o.lo, o.hi)}${o.price_confirmed === false ? "†" : ""}</span>`;

const STATUS = { sold_out: "Sold out", unconfirmed: "Unconfirmed", season_closed: "Season closed", in_stock: "In stock", no_ship: "Doesn't ship to NJ", far_pickup: "Pickup only, far away" };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
// ship timing (data/ship_timing.json): is a late-fall arrival in zone 6b/7a OK from this nursery?
const TIMING = { safe: "Safe timing", ask: "Pick ship date", risky: "Ships any season", unknown: "Timing unknown" };
const timing = o => o.form === "seed" ? { t: "safe", why: "Seed packets ship in any season." } : D.timing[o.nursery] || { t: "unknown", why: "No shipping season on file for this nursery." };

const unitOf = v => v.sold === "seed" ? "packet" : v.crop ? "item" : (v.F.unit || "plant");

function dealCard(v) {

function alertHTML(v) {

const rowTotal = o => o.lo != null && !o.ok && o.hi - o.lo >= 1 ? `<span class="total t-est">about ${money(Math.round(o.mid))}${o.price_confirmed === false ? "†" : ""}</span>` : totalHTML(o);

  if (so) out.push(`<span class="b sale" data-tip="${esc(`${so.n.name} has it on sale${so.sale.was ? `: ${money(so.price)}, regularly ${money(so.sale.was)}` : ""}`)}">${ICON.tag}${so.sale.pct ? `On sale −${so.sale.pct}%` : "On sale"}</span>`);

function rowHTML(v) {

function offerHTML(o, best, unit) {

function detailHTML(v) {

// ---------------------------------------------------------------- wagon (cart): plan the cheapest set of orders
const WAGON_SVG = '<svg viewBox="0 0 30 23" fill="none" aria-hidden="true"><path d="M2.5 6.5h18.5l-2.2 9.2H4.7z" fill="currentColor"/><path d="M5.5 9.5h13M6 12.5h12" stroke="var(--hdr)" stroke-opacity=".35" stroke-width="1"/><path d="M21 6.5l6.5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="7.5" cy="19" r="3" fill="currentColor" stroke="var(--card)" stroke-width="1.2"/><circle cx="16.5" cy="19" r="3" fill="currentColor" stroke="var(--card)" stroke-width="1.2"/></svg>';

let COUPONS = { checked: null, stores: {} };   // unverified coupon codes were removed before the public launch
const W = { items: store.get("rfd.wagon", []).filter(i => i && i.key) };
S.view = "board"; S.plan = store.get("rfd.wagon.plan", "cheapest"); S.pickup = store.get("rfd.wagon.pickup", false);

// one "store" per nursery name, so the same business listed under two ids still counts as one order
const gidOf = n => String(n.name || n.id).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
const originOf = u => { try { return new URL(u).origin; } catch { return u || ""; } };
function buildGroups() {
  D.groups = {};

const groupOf = gid => D.groups[gid.replace(/#pickup$/, "")] || { name: gid, rule: { type: "estimate", low: 20, high: 40 }, notes: new Set() };

function lineOptions(it) {
  const v = D.byKey[it.key];
  if (!v) return { v: null, opts: [], all: [] };

  for (const o of v.offers) {
    if (o.price == null) continue;

    if (!byG[gid] || o.price < byG[gid].price) byG[gid] = { gid, o, price: o.price };
  }
  const all = Object.values(byG).sort((a, b) => a.price - b.price);
  let opts = all;
  if (it.lock && byG[it.lock]) opts = [byG[it.lock]];

// shipping for everything going in one box from one store
function boxShip(gid, lines) {
  const sub = lines.reduce((s, l) => s + l.price * l.qty, 0), units = lines.reduce((s, l) => s + l.qty, 0);
  if (gid.endsWith("#pickup")) return { lo: 0, hi: 0, ok: true, how: "pickup", sub };
  const r = groupOf(gid).rule || {};
  switch (r.type) {
    case "flat": return { lo: r.amount, hi: r.amount, ok: true, how: "flat", sub };
    case "included": return { lo: 0, hi: 0, ok: true, how: "incl", sub };
    case "percent": { const t = r.tiers.find(([m]) => sub <= m) || r.tiers[r.tiers.length - 1]; const v = Math.max(r.min || 0, Math.round(sub * t[1] * 100) / 100) + (r.plus || 0); return { lo: v, hi: v, ok: true, how: "pct", pct: t[1], min: r.min, plus: r.plus, sub }; }

}

  const r = el.getBoundingClientRect(), w = Math.min(300, innerWidth - 24);
  tipPop.style.width = w + "px";
  const h = tipPop.offsetHeight;
  let y = r.bottom + 8; if (y + h > innerHeight - 8 && r.top - h - 8 > 0) y = r.top - h - 8;
  tipPop.style.left = clamp(r.left + r.width / 2 - w / 2, 12, innerWidth - w - 12) + "px"; tipPop.style.top = y + "px";
}

  const ti = $("#tabs"); if (!ti) return;
  const cs = $("#catsel"); if (cs) cs.innerHTML = tabs.map(f => `<option value="${f.id}" ${f.id === S.fruit ? "selected" : ""}>${esc(f.plural)} (${D.all.filter(v => (f.id === "all" || v.fruit === f.id) && v.inStock).length} in stock)</option>`).join("");

}

function setFruit(id, push = true) {
  S.fruit = id; S.open = null; S.view = S.view === "prices" || S.view === "sales" ? S.view : "board";
  renderTabs(); render(); updateWagonBtn();
  if (push) window.scrollTo({ top: 0 });
  if (push && S.view === "board") try { history.replaceState(null, "", id === "all" ? location.pathname : `#${id}`); } catch {}
}

function toggle(key, force) {
  const v = D.byKey[key];
  if (force && v && S.fruit !== v.fruit) { S.fruit = v.fruit; try { history.replaceState(null, "", `#${S.fruit}`); } catch {} renderTabs(); }
  S.open = force ? key : (S.open === key ? null : key);
  render();
  if (S.open && !force) requestAnimationFrame(() => document.getElementById(S.open)?.scrollIntoView({ block: "nearest" }));
  if (S.open && force) requestAnimationFrame(() => document.getElementById(S.open)?.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }));
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-zipreset]")) { store.set("rfd.zip", null); location.reload(); return; }
  const hs = e.target.closest("[data-hist]");
  if (hs) { e.preventDefault(); e.stopPropagation(); const v = D.byKey[hs.dataset.hist]; S.phOpen = hs.dataset.hist; S.phf = "all"; S.q = ""; $("#q").value = ""; if (v && S.fruit !== "all") S.fruit = v.fruit; setView("prices"); requestAnimationFrame(() => document.getElementById("ph-" + hs.dataset.hist)?.scrollIntoView({ block: "start" })); return; }
  const pf = e.target.closest("[data-phf]");
  if (pf) { S.phf = S.phf === pf.dataset.phf && pf.classList.contains("tile") ? "all" : pf.dataset.phf; store.set("rfd.phf", S.phf); render(); return; }
  const pt = e.target.closest("[data-phtoggle]");
  if (pt && !e.target.closest("a")) { const k = pt.dataset.phtoggle; S.phOpen = S.phOpen === k ? null : k; render(); if (S.phOpen) requestAnimationFrame(() => document.getElementById("ph-" + k)?.scrollIntoView({ block: "nearest" })); return; }
  const sfb = e.target.closest("[data-sf]");
  if (sfb) { S.sf = S.sf === sfb.dataset.sf && sfb.classList.contains("tile") ? "all" : sfb.dataset.sf; store.set("rfd.sf", S.sf); render(); return; }
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); closeMore(); if (S.q) { S.q = ""; $("#q").value = ""; } if (go.dataset.go === "home") { S.fruit = "all"; S.q = ""; $("#q").value = ""; S.open = null; setView("board"); } else setView(go.dataset.go); return; }
  const wg = e.target.closest("[data-wagon]");
  if (wg) { e.stopPropagation(); e.preventDefault(); wagonToggle(wg.dataset.wagon); render(); return; }
  const pl = e.target.closest("[data-plan]");
  if (pl && !pl.disabled) { S.plan = pl.dataset.plan; store.set("rfd.wagon.plan", S.plan); render(); return; }
  const qb = e.target.closest("[data-qty]");
  if (qb) { const it = W.items.find(i => i.key === qb.dataset.qty); if (it) { it.qty = clamp((it.qty || 1) + Number(qb.dataset.d), 1, 99); saveWagon(); render(); } return; }
  const rm = e.target.closest("[data-rm]");
  if (rm) { W.items = W.items.filter(i => i.key !== rm.dataset.rm); saveWagon(); render(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { copyText(cp.dataset.copy, cp, cp.parentElement.querySelector("b")); return; }
  const cl = e.target.closest("[data-copylist]");
  if (cl) { const ta = $("#wlist"); copyText(ta.value, cl, ta); return; }
  const tab = e.target.closest("[data-fruit]");
  if (tab && !tab.disabled) { setFruit(tab.dataset.fruit); return; }
  const star = e.target.closest("[data-star]");
  if (star) { e.stopPropagation(); const k = star.dataset.star; S.starred.has(k) ? S.starred.delete(k) : S.starred.add(k); store.set("rfd.starred2", [...S.starred]); render(); return; }
  const op = e.target.closest("[data-open]");
  if (op) { e.preventDefault(); const v = D.byKey[op.dataset.open];
    if (v && S.view !== "board") { S.view = "board"; if (S.fruit !== "all" && S.fruit !== v.fruit) S.fruit = v.fruit; try { history.replaceState(null, "", S.fruit === "all" ? location.pathname : `#${S.fruit}`); } catch {} renderTabs(); updateWagonBtn(); updateGardenBtn(); render(); } if (v?.inStock) { S.q = ""; $("#q").value = ""; S.f.clear(); toggle(v.key, true); } else if (v) revealSold(v); return; }
  const tg = e.target.closest("[data-toggle]");
  if (tg) { toggle(tg.dataset.toggle); return; }
  const fchip = e.target.closest("[data-form]");
  if (fchip) { const k = fchip.dataset.form; S.forms.has(k) ? S.forms.delete(k) : S.forms.add(k); store.set("rfd.forms", [...S.forms]); render(); return; }
  const chip = e.target.closest("[data-f]");
  if (chip) { const k = chip.dataset.f; S.f.has(k) ? S.f.delete(k) : S.f.add(k); store.set("rfd.filters", [...S.f]); render(); return; }
});
document.addEventListener("keydown", e => {
  if (e.target.closest?.("button,select,input,a")) return;
  const dc = e.target.closest?.('.deal[data-open]');
  if (dc && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); dc.click(); return; }
  if (e.target.closest?.(".brand") && e.key === "Enter") { e.target.closest(".brand").click(); return; }
  const pt = e.target.closest?.("[data-phtoggle]"); if (pt && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pt.click(); return; }
  const tg = e.target.closest?.("[data-toggle]"); if (tg && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(tg.dataset.toggle); } });
document.addEventListener("change", e => {
  if (e.target.dataset?.lock) { const it = W.items.find(i => i.key === e.target.dataset.lock); if (it) { it.lock = e.target.value || null; saveWagon(); render(); } return; }
  if (e.target.id === "wpickup") { S.pickup = e.target.checked; store.set("rfd.wagon.pickup", S.pickup); render(); return; }
  if (e.target.id === "sssort") { S.ss = e.target.value; store.set("rfd.ss", S.ss); render(); return; }
  if (e.target.id === "phsort") { S.phs = e.target.value; store.set("rfd.phs", S.phs); render(); return; }
  if (e.target.id === "catsel") { setFruit(e.target.value); return; }
  if (e.target.id === "cropsel") { S.crop = e.target.value; render(); return; }
  if (e.target.id === "sort") { S.sort = e.target.value; store.set("rfd.sort", S.sort); render(); } });
let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; if (S.q.trim() && S.fruit !== "all") { S.fruit = "all"; S.open = null; renderTabs(); } if (S.view !== "board" && S.view !== "prices" && (S.view !== "sales" || S.q.trim())) { S.view = "board"; try { history.replaceState(null, "", S.fruit === "all" ? location.pathname : `#${S.fruit}`); } catch {} renderTabs(); updateWagonBtn(); updateGardenBtn(); } render(); }, 120); });

// deep links: #raspberry  ·  #raspberry.jewel  ·  #ksu-benson (older links, any fruit)
function readHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  if (h === "wagon" || h === "prices" || h === "sales" || h === "about") { S.view = h; return; }
  if (D.meta[h]) { S.fruit = h; return; }
  const key = D.byKey[h] ? h : D.all.find(v => v.id === h)?.key;
  if (key) { const v = D.byKey[key]; S.fruit = v.fruit; if (v.inStock) S.open = key; else { S.soldOpen = true; S.soldKey = key; S.keepSold = true; } }
}

async function load() {
  try {
    const get = p => fetch(DATA_BASE + p.replace(/^data\//, ""), { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); });
    const reg = await get("fruits.json");
    D.fruits = reg.fruits;
    for (const [id, x] of Object.entries(INLINE_FRUITS)) if (!D.fruits.some(f => f.id === id)) D.fruits.push(x.registry); let want = store.get("rfd.zip", null);
    if (!validZip(want || "")) want = HOME_ZIP;
    D.shipTo = want; D.shipRegion = regionOfZip(D.shipTo); D.shipState = stateOf(D.shipRegion);
    $("#zip").textContent = D.shipTo; $("#zipBtn").title = `Prices include shipping to ${D.shipTo} (${D.shipState}). Click to change.`;
    STATUS.no_ship = `Doesn't ship to ${D.shipState}`;
    if (D.shipTo !== HOME_ZIP) { try { const sj = await get("shipping.json"); for (const rec of Object.values(sj.nurseries || {})) for (const id of rec.board_ids || []) D.ship[id] = rec; } catch {} }
    try { D.timing = (await get("ship_timing.json")).nurseries || {}; } catch { D.timing = {}; }
    const live = D.fruits.filter(f => f.status === "live" && f.data);
    // one fruit's file failing to load hides only that fruit
    const files = await Promise.all(live.map(f => (f.inline ? Promise.resolve(INLINE_FRUITS[f.id].data) : get(f.data)).then(fd => [f, fd]).catch(() => [f, null])));
    for (const [f, fd] of files) if (fd) { localize(f, fd); D.all.push(...prepare(f, fd)); }
    D.byKey = Object.fromEntries(D.all.map(v => [v.key, v]));
    for (const v of D.all) { try { v.ph = priceHist(v); } catch { v.ph = null; } }
    buildGroups();
    OWNED = ownedSet();
    buildSearchIndex(); if (!$("#qghost")) initSearchUI();
    if (!D.all.length) throw new Error("no fruit data");
    const loaded = live.filter(f => D.meta[f.id]);
    if (loaded.length === 1) S.fruit = loaded[0].id;
    readHash();
    renderTabs(); render(); updateWagonBtn(); updateGardenBtn(); salesCount(); if (!initZipUI.done) { initZipUI(); initZipUI.done = true; }
    if (S.open) document.getElementById(S.open)?.scrollIntoView({ block: "start" });
    else if (S.soldKey) document.getElementById(S.soldKey)?.scrollIntoView({ block: "center" });
  } catch (err) {
    $("#app").innerHTML = `<div class="loading">The price data didn't load (${esc(err.message)}). Reload the page to try again.</div>`;
  }
}
document.addEventListener("toggle", e => {
  if (e.target.id !== "nightly") return;
  S.statusOpen = e.target.open; store.set("rfd.statusOpen", S.statusOpen);
  const l = e.target.querySelector(".more-lbl"); if (l) l.textContent = S.statusOpen ? "Hide" : "Details";
}, true);
document.addEventListener("submit", e => {
  const f = e.target.closest?.("[data-alertform]"); if (!f) return;
  e.preventDefault();
  const k = f.dataset.alertform, val = parseFloat(f.elements.t.value);
  if (val > 0) { S.targets = { ...S.targets, [k]: Math.round(val * 100) / 100 }; if (!S.starred.has(k)) { S.starred.add(k); store.set("rfd.starred2", [...S.starred]); } }
  else { const t = { ...S.targets }; delete t[k]; S.targets = t; }
  store.set("rfd.targets", S.targets); render();
});
document.addEventListener("click", e => {
  const c = e.target.closest?.("[data-alertclear]"); if (!c) return;
  const t = { ...S.targets }; delete t[c.dataset.alertclear]; S.targets = t; store.set("rfd.targets", S.targets); render();
});
Promise.resolve(load()).finally(() => syncInit());
})();
</script>
